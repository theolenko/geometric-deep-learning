brain:
  ap_axis: 1
  patch_radius_mm: 40

retinotopy:
  # Log-polar cortical magnification model (Schwartz 1980)
  scale: 15.1     # mm/deg  foveal magnification factor (Cowey & Rolls 1974, Table 1)
  a_param: 1.6    # deg  foveal offset; Drasdo (1977) as cited by Schwartz (1980)
  k_param: 0.065  # deg^-1  magnification fall-off (Horton & Hoyt 1991)
  ecc_min: 0.1    # deg  minimum clipped eccentricity
  ecc_max: 12.0   # deg  maximum clipped eccentricity

prf:
  n_stimuli: 100          # number of simulated visual stimuli
  stim_ecc_max: 10.0      # deg  max eccentricity of stimuli
  sigma_base: 0.5         # deg  pRF size intercept (Harvey & Dumoulin 2011)
  sigma_slope: 0.15       # pRF size growth rate with eccentricity (Harvey & Dumoulin 2011)
  noise_level: 0.05       # std of additive Gaussian noise (mimics fMRI noise)
  seed: 42

hyperbolic:
  # kappa = curvature parameter
  # kappa=0.0  Euclidean (flat, baseline)
  # kappa>0    hyperbolic space; higher = stronger curvature
  curv_values: [0.5,1.0] #[0.01,0.05,0.09,0.1,0.5,1.0]

spherical: 
  curv_values: [0.01,0.05]


output:
  dir: ./data/generated
  groundtruth_filename: retinotopy_groundtruth.pt
