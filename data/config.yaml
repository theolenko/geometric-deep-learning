brain:
  # fsaverage = standard FreeSurfer average brain (Fischl et al. 1999)
  surface: fsaverage
  # Posterior boundary for visual cortex in MNI y-axis (mm)
  # Everything behind this threshold is kept as visual cortex
  y_threshold: -70.0

retinotopy:
  # Log-polar cortical magnification model (Schwartz 1980)
  scale: 15.0     # mm — growth rate of eccentricity with surface distance
  a_param: 0.5    # deg — foveal offset (eccentricity at the pole)
  k_param: 0.065  # deg⁻¹ — magnification fall-off (Horton & Hoyt 1991)
  ecc_min: 0.1    # deg — minimum clipped eccentricity
  ecc_max: 12.0   # deg — maximum clipped eccentricity

prf:
  n_stimuli: 100          # number of simulated visual stimuli
  stim_ecc_max: 10.0      # deg — max eccentricity of stimuli
  sigma_base: 0.2         # deg — pRF size at the fovea (Harvey & Dumoulin 2011)
  sigma_slope: 0.3        # pRF size growth rate with eccentricity
  noise_level: 0.05       # std of additive Gaussian noise (mimics fMRI noise)
  seed: 42

hyperbolic:
  # kappa = curvature parameter
  # kappa=0.0 → Euclidean (flat, baseline)
  # kappa>0   → hyperbolic space; higher = stronger curvature
  curv_values: [0.0, 0.01, 0.05, 0.1, 0.5, 1.0]

spherical: 
  curv_values: [0.0, 0.01, 0.05, 0.1, 0.5, 1.0]


split:
  train: 0.70   # 70% of nodes used for training   → ~12,084 nodes
  val:   0.15   # 15% for validation (tune kappa)  →  ~2,589 nodes
  test:  0.15   # 15% held out for final evaluation →  ~2,590 nodes
  seed: 0

output:
  dir: ./data/generated
  groundtruth_filename: retinotopy_groundtruth.pt
